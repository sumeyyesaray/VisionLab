[project]
name = "visionlab"
version = "0.1.0"
description = "Computer vision / ML research and experimentation project"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pillow",
    "pyyaml",
    "torch",
    "torchvision",
    "matplotlib",
    "mlflow",
    "tensorboard",
]

[tool.setuptools.packages.find]
include = ["src*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
