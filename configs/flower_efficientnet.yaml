# EfficientNet-B3 architecture comparison — identical to flower.yaml except model name, so any
# difference is attributable to architecture alone. ResNet-50 had no confusion problem here
# (Run 3: macro-F1 0.9882), so this is mainly a control/completeness check — see
# notebooks/08_mushroom_confusion_diagnosis.ipynb for why we're comparing architectures at all.
dataset_type: flower
dataset_root: datasets/extracted/flower_data
label_map_path: configs/label_maps/flower_label_map.json

image_size: 224
batch_size: 16
num_workers: 4
pin_memory: false # only helps on CUDA; training runs on CPU (TRUBA orfoz partition)

augmentation_preset: heavy
random_resized_crop_scale: [0.7, 1.0]

model:
  name: efficientnet_b3
  pretrained: true
  freeze_backbone: false # default to fine-tune, matching the ResNet-50 config

# Flower is naturally imbalanced (std≈35.4 in Sprint 1) — class-weighted
# loss is a real candidate here, unlike mushroom.
# epochs is a high ceiling — early_stopping_patience decides the actual stop,
# not this number (see scripts/train_baseline.py).
training:
  loss: cross_entropy
  class_weighted_loss: true
  optimizer: adamw
  lr: 0.0001
  epochs: 30
  early_stopping_patience: 5 # stop if val_macro_f1 hasn't improved in this many epochs
  lr_scheduler_patience: 2 # ReduceLROnPlateau: halve lr if val_loss plateaus this long
  mixed_precision: true # only takes effect on CUDA; no-op on CPU
