# Stage 1 of a two-stage fine-tuning experiment (see notebooks/08_mushroom_confusion_diagnosis.ipynb).
# Identical recipe to Run 6 (384px, uniform light augmentation, all 169 classes) — the goal here
# is just a solid general-purpose baseline to fine-tune in Stage 2. Uses a distinct
# `checkpoint_name` so it doesn't collide with other concurrently-running mushroom experiments
# that also build a plain "resnet50" (Run 6's own checkpoint was already overwritten by
# Run 7/the scarcity-aware-medium run, which is why this needs a fresh Stage 1 rather than
# reusing Run 6's weights directly).
dataset_type: mushroom
dataset_root: datasets/extracted/mushroom
label_map_path: configs/label_maps/mushroom_label_map.json
checkpoint_name: mushroom_resnet50_twostage_stage1

image_size: 384
batch_size: 16
num_workers: 4
pin_memory: false # only helps on CUDA; training runs on CPU (TRUBA orfoz partition)

augmentation_preset: light
random_resized_crop_scale: [0.9, 1.0]

model:
  name: resnet50
  pretrained: true
  freeze_backbone: false

training:
  loss: cross_entropy
  class_weighted_loss: false
  optimizer: adamw
  lr: 0.0001
  epochs: 30
  early_stopping_patience: 8
  lr_scheduler_patience: 2
  mixed_precision: true # only takes effect on CUDA; no-op on CPU
