# Flower dataset is small (64 images/class avg, min 27) and naturally
# imbalanced — augmentation here also has to work as a diversity multiplier,
# not just regularization. Heavier preset, wider crop scale than mushroom.
# See notebooks/02_flower_dataset_exploration.ipynb, section 12.
dataset_type: flower
dataset_root: datasets/extracted/flower_data
label_map_path: configs/label_maps/flower_label_map.json

image_size: 224
batch_size: 16
num_workers: 4
pin_memory: false # only helps on CUDA; training runs on CPU (TRUBA orfoz partition)

augmentation_preset: heavy
random_resized_crop_scale: [0.7, 1.0]

# ResNet-50 chosen first per the Sprint 4 model research wrap-up (lowest-risk
# option to validate the Model Zoo registry/checkpoint design) — see
# notebooks/04_model_research_part2.ipynb, "Summary — Model Research
# Wrap-Up & Trial Order".
model:
  name: resnet50
  pretrained: true
  freeze_backbone: false # default to fine-tune, per Reading Note 1 (Yosinski et al.)

# Flower is naturally imbalanced (std≈35.4 in Sprint 1) — class-weighted
# loss is a real candidate here, unlike mushroom.
# epochs is a high ceiling — early_stopping_patience decides the actual stop,
# not this number (see scripts/train_baseline.py).
training:
  loss: cross_entropy
  class_weighted_loss: true
  optimizer: adamw
  lr: 0.0001
  epochs: 30
  early_stopping_patience: 5 # stop if val_macro_f1 hasn't improved in this many epochs
  lr_scheduler_patience: 2 # ReduceLROnPlateau: halve lr if val_loss plateaus this long
  mixed_precision: true # only takes effect on CUDA; no-op on CPU
